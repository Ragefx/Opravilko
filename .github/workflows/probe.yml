name: Store probe (temporary)
on:
  push:
    branches: [claude/great-ride-xt5fan]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q curl_cffi
      - name: Probe
        shell: python3 {0}
        run: |
          import re, json, collections
          from curl_cffi import requests as R
          s = R.Session(impersonate="chrome")
          out = []
          c = collections.Counter(); ex = []
          for p in range(1, 4):
            b = s.get(f"https://www.hofer.si/izdelki/pregled-posebne-ponudbe/k/1588161418378530?page={p}", timeout=30).text
            c.update(re.findall(r'class="(base-price__[a-z_-]+)', b))
            for m in re.finditer(r'class="base-price__(?!regular|discount-tag__wrapper)[a-z_-]+', b):
              if len(ex) < 2: ex.append(re.sub(r"<!--.*?-->|\s+", " ", b[m.start():m.start()+250]))
          out.append("HOFER " + json.dumps(c)); out += ["  EX " + e for e in ex]
          b = s.get("https://online.spar.si/aktualno/iz-letaka/S17/S17-1", timeout=30).text
          u = b.replace('\\"', '"')
          out.append("SPAR page " + str(len(b)) + " " + str({k: u.count(k) for k in ['"price"', '"promotion"', '"sku"', '"specialPrice"']}))
          srcs = sorted(set(re.findall(r'src="(/_next/static/[^"]+\.js)"', b)))
          ops = set(); bodies = []
          for sr in srcs:
            js = s.get("https://online.spar.si" + sr, timeout=30).text
            for m in re.finditer(r'query (\w+)\(', js):
              ops.add(m.group(1))
              if re.search(r'ProductsBy|Search|Category', m.group(1)) and len(bodies) < 3:
                body = js[m.start():m.start()+900]
                bodies.append(re.sub(r"\s+", " ", body.replace("\\n", " ")))
          out.append("SPAR ops " + " ".join(sorted(ops)))
          out += ["  Q " + q for q in bodies]
          print("\n".join(out))
