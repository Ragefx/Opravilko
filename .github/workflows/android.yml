name: Android app

# Builds the Android APK from the same web code as the website, and publishes
# it as a GitHub release so it can be downloaded straight onto a phone.
# Runs only when started by hand (Actions -> Android app -> Run workflow), so
# website changes don't produce a new APK each time.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The ubuntu runner ships the Android SDK (ANDROID_HOME) with licenses
      # accepted; Gradle downloads any missing platform/build-tools itself.

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web app and sync it into the Android project
        working-directory: frontend
        env:
          # Same public Dropbox client ID as the website (not a secret).
          VITE_DROPBOX_APP_KEY: r3h3ykmuieiyd3x
          VITE_DROPBOX_DATA_PATH: /opravilko-data.json
          # Sign-in from the app returns through the website's callback page.
          VITE_WEB_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: npm run build:android

      # Optional: with a signing key stored in the repo's secrets, builds are
      # signed consistently, so each new APK installs as an update over the
      # last. Without it, a debug-signed APK is built instead.
      - name: Decode signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "keystore=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            # The APK to install directly; the bundle (.aab) is what Google Play takes.
            ./gradlew --no-daemon assembleRelease bundleRelease -PversionCode=${{ github.run_number }}
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Opravilko.apk"
            cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/Opravilko.aab"
          else
            ./gradlew --no-daemon assembleDebug -PversionCode=${{ github.run_number }}
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Opravilko.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Opravilko-apk
          path: ${{ runner.temp }}/Opravilko.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Opravilko for Android (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **Opravilko.apk** below on your Android phone and open it to install.
            **Opravilko.aab** is the same build for uploading to Google Play.
            Built from ${{ github.sha }}.
          files: |
            ${{ runner.temp }}/Opravilko.apk
            ${{ runner.temp }}/Opravilko.aab
          fail_on_unmatched_files: false
