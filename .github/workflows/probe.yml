name: Store probe (temporary)
on:
  push:
    branches: [claude/great-ride-xt5fan]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q curl_cffi
      - name: Probe
        shell: python3 {0}
        run: |
          import re, json, html as H
          from curl_cffi import requests as R
          s = R.Session(impersonate="chrome")
          def get(u):
            try:
              r = s.get(u, timeout=30, headers={"Accept-Language": "sl-SI,sl;q=0.9"}); print("##", u, r.status_code, r.url, len(r.text)); return r.text if r.ok else None
            except Exception as e: print("##", u, "ERR", e)
          def ctx(b, pat, n=3, w=600):
            for m in list(re.finditer(pat, b))[:n]: print("   …", re.sub(r"\s+"," ",b[max(0,m.start()-w//2):m.start()+w//2]))
          print("\n===== HOFER")
          for u in ["https://www.hofer.si/posebna-ponudba/2026-10-08", "https://www.hofer.si/izdelki/pregled-posebne-ponudbe/k/1588161418378530"]:
            b = get(u)
            if not b: continue
            for k in ["product-tile", "base-price", "price", "__NUXT__", "__NEXT_DATA__", "application/ld+json", "strikethrough", "regular", "€"]: print(" ", k, b.count(k))
            ctx(b, r'product-tile', 2, 2500)
            print(sorted(set(re.findall(r'https?://[a-zA-Z0-9.-]*(?:api|search)[a-zA-Z0-9.-]*[^"\'\s<>\\]{0,80}', b)))[:15])
          print("\n===== SPAR www")
          b = get("https://www.spar.si/")
          if b:
            print(sorted(set(re.findall(r'href="([^"]*(?:akcij|letak|ponudb|katalog)[^"]*)"', b)))[:30])
          print("\n===== SPAR online js")
          b = get("https://online.spar.si/akcije")
          if b:
            srcs = sorted(set(re.findall(r'src="(/_next/static/[^"]+\.js)"', b)))
            print(len(srcs))
            found = set()
            for sr in srcs:
              try: js = s.get("https://online.spar.si" + sr, timeout=30).text
              except Exception: continue
              for m in re.findall(r'https?://[a-zA-Z0-9.-]+(?:/[a-zA-Z0-9_./-]*)?', js):
                if re.search(r'api|graphql|instaleap|search', m) and m not in found:
                  found.add(m); print("  ", sr[-30:], m)
              if "graphql" in js and "akcij" in js.lower(): print("  graphql+akcij in", sr)
            ctx(b, r'akcije', 2, 800)
          print("\n===== TUS katalog")
          b = get("https://www.tus.si/aktualno/akcijska-ponudba/aktualno-iz-kataloga")
          if b:
            print("Redna", b.count("Redna cena"), sorted(set(re.findall(r'href="([^"]*/page/\d+/?[^"]*)"', b)))[:10])
          print("\n===== LIDL one food tile")
          b = get("https://www.lidl.si/c/super-ponudba-od-cetrtka/a10104430")
          for t in re.findall(r'data-grid-data="([^"]+)"', b or ""):
            d = json.loads(H.unescape(t))
            if (d.get("keyfacts") or {}).get("analyticsCategory") == "Food" and "oldPrice" in json.dumps(d.get("price")):
              print(json.dumps({k: d.get(k) for k in ["fullTitle","price","storeStartDate","storeEndDate","canonicalUrl","image","ribbons","stockAvailability"]}, ensure_ascii=False)[:2000]); break
