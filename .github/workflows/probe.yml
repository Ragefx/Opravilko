name: Store probe (temporary)
on:
  push:
    branches: [claude/great-ride-xt5fan]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q curl_cffi
      - name: Probe
        shell: python3 {0}
        run: |
          import re, json, collections
          from curl_cffi import requests as R
          s = R.Session(impersonate="chrome")
          def get(u):
            r = s.get(u, timeout=30, headers={"Accept-Language": "sl-SI,sl;q=0.9"}); print("##", u, r.status_code, len(r.text)); return r.text
          print("== HOFER price classes")
          c = collections.Counter()
          for p in range(1, 4):
            b = get(f"https://www.hofer.si/izdelki/pregled-posebne-ponudbe/k/1588161418378530?page={p}")
            c.update(re.findall(r'class="(base-price__[a-z_-]+)', b))
            for m in list(re.finditer(r'base-price__(?!regular|discount-tag__wrapper)[a-z_-]+', b))[:2]:
              print("  ", re.sub(r"<!--.*?-->", "", b[m.start()-40:m.start()+300]))
          print(c)
          print("== SPAR category page")
          b = get("https://online.spar.si/aktualno/iz-letaka/S17/S17-1")
          u = b.replace('\\"', '"')
          for k in ['"price"', '"promotion"', '"name"', '"sku"', '"specialPrice"', '"conditions"']: print(k, u.count(k))
          m = re.search(r'"sku"', u)
          if m: print("  …", u[m.start()-600:m.start()+1400])
          print("== SPAR chunks with product queries")
          srcs = sorted(set(re.findall(r'src="(/_next/static/[^"]+\.js)"', b)))
          for sr in srcs:
            js = s.get("https://online.spar.si" + sr, timeout=30).text
            for m in re.finditer(r'(?:query|mutation) (\w*[Pp]roduct\w*)\(', js):
              print("  ", sr[-35:], m.group(1)); 
            m = re.search(r'query \w*[Pp]roductsBy\w*\(', js) or re.search(r'query \w*[Ss]earch\w*\(', js)
            if m: print("    BODY", js[m.start():m.start()+1500].replace("\\n"," "))
