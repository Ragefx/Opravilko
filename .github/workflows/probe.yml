name: Store probe (temporary)
on:
  push:
    branches: [claude/great-ride-xt5fan]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q curl_cffi
      - name: Probe
        shell: python3 {0}
        run: |
          import re, json, html as H
          from curl_cffi import requests as R
          s = R.Session(impersonate="chrome")
          def get(u):
            try:
              r = s.get(u, timeout=30, headers={"Accept-Language": "sl-SI,sl;q=0.9"}); print("##", u, r.status_code, r.url, len(r.text)); return r.text if r.ok else None
            except Exception as e: print("##", u, "ERR", e)
          def ctx(b, pat, n=3, w=600):
            for m in list(re.finditer(pat, b))[:n]: print("   …", re.sub(r"\s+"," ",b[max(0,m.start()-w//2):m.start()+w//2]))
          print("\n===== HOFER")
          for u in ["https://www.hofer.si/sl/ponudba.html", "https://www.hofer.si/"]:
            b = get(u)
            if b:
              print(sorted(set(re.findall(r'href="([^"]*(?:ponudb|akcij|letak)[^"]*)"', b)))[:40]); ctx(b, "€", 3)
          print("\n===== SPAR /akcije")
          b = get("https://online.spar.si/akcije")
          if b:
            for k in ["\\\"price\\\"", "promotion", "\\\"name\\\"", "listPrice", "salePrice", "discount", "__NEXT_DATA__", "apollo", "graphql"]:
              print(k, b.count(k))
            ctx(b, r'listPrice|salePrice|promotion', 3, 1200)
            print(sorted(set(re.findall(r'https?://[a-zA-Z0-9.-]*(?:api|graphql|instaleap)[^"\'\s<>\\]*', b)))[:20])
          print("\n===== LIDL tiles")
          home = get("https://www.lidl.si/")
          pages = sorted(set(re.findall(r'href="((?:https://www\.lidl\.si)?/c/[^"]+/[as]\d+)"', home or "")))
          print(pages)
          for p in pages[:12]:
            u = p if p.startswith("http") else "https://www.lidl.si" + p
            b = get(u)
            if not b: continue
            tiles = re.findall(r'data-grid-data="([^"]+)"', b)
            n = 0
            for t in tiles:
              try: d = json.loads(H.unescape(t))
              except Exception as e: print("bad", e); continue
              items = d if isinstance(d, list) else [d]
              for it in items:
                pr = it.get("price") or {}
                if n < 4: print("   ", it.get("fullTitle"), "|", pr.get("price"), "|", pr.get("oldPrice"), "|", (pr.get("discount") or {}).get("discountText"), "|", it.get("storeStartDate"), it.get("storeEndDate"), "|", (it.get("keyfacts") or {}).get("analyticsCategory"))
                n += 1
            print("  tiles", n)
          print("\n===== TUS pages")
          b = get("https://www.tus.si/aktualno/akcijska-ponudba/")
          if b:
            print("h3", len(re.findall(r"<h3>", b)), "Redna", b.count("Redna cena"))
            print(sorted(set(re.findall(r'href="([^"]*(?:page|stran|paged)[^"]*)"', b)))[:20])
            ctx(b, "load-more|pagination|data-page|data-max", 3, 400)
            ctx(b, "velja|Velja|do \\d", 2, 300)
