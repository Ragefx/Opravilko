name: Store probe (temporary)
on:
  push:
    branches: [claude/great-ride-xt5fan]
    paths: [".github/workflows/probe.yml", "deals/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q curl_cffi
      - run: |
          python deals/fetch.py --dry 2>&1 | grep -v 'Hofer", "n\|Lidl", "n\|Tuš", "n' | head -30
