name: Store probe (temporary)
on:
  push:
    branches: [claude/great-ride-xt5fan]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q curl_cffi
      - name: Probe
        shell: python3 {0}
        run: |
          import json
          from curl_cffi import requests as R
          s = R.Session(impersonate="chrome")
          API = "https://deadpool.unified-jennet.instaleap.io/api/v3"
          H = {"Origin": "https://online.spar.si", "Referer": "https://online.spar.si/", "content-type": "application/json",
               "dpl-api-key": "febe3691-edb4-498b-b1a6-d6fe1ddd068e", "apollographql-client-name": "e-commerce Moira Engine client SPAR_SLOVENIA",
               "apollographql-client-version": "0.19.358", "client-name": "e-commerce Moira Engine SPAR_SLOVENIA", "client-version": "0.19.358"}
          def q(fields, size=3, ref="S17-1"):
            inp = {"categoryReference": ref, "clientId": "SPAR_SLOVENIA", "storeReference": "81701", "currentPage": 1, "pageSize": size}
            r = s.post(API, headers=H, json={"query": "query G($i: GetProductsByCategoryInput!) { getProductsByCategory(getProductsByCategoryInput: $i) { category { name products { " + fields + " } } } }", "variables": {"i": inp}}, timeout=30)
            print("==", fields[:80], "->", r.status_code, r.text[:900]); return r
          q("name price promotion { type }")
          q("name price promotion { type description conditions { price quantity } }")
          q("name price promotion { type description startDateTime endDateTime conditions { price priceBeforeTaxes quantity } } unit")
          q("name price specialPrice promotions { type }")
          q("name price promotions { type description conditions { price } endDateTime }")
          q("name price stock unit slug photosUrl")
          r = q("sku", 500)
          try: print("COUNT", len(r.json()["data"]["getProductsByCategory"]["category"]["products"]))
          except Exception as e: print("count err", e)
          r = s.post(API, headers=H, json={"query": "query G($i: GetProductsByCategoryInput!) { getProductsByCategory(getProductsByCategoryInput: $i) { pagination { total pages } category { name } } }", "variables": {"i": {"categoryReference": "S17-1", "clientId": "SPAR_SLOVENIA", "storeReference": "81701", "currentPage": 1, "pageSize": 50}}}, timeout=30)
          print("PAG", r.text[:500])
